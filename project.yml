name: ConversationTranslator
options:
  bundleIdPrefix: local.conversation
  deploymentTarget:
    iOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  ConversationTranslator:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.conversation.translator
        MARKETING_VERSION: '0.2.0'
        CURRENT_PROJECT_VERSION: '3'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 自由对话
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 录制当前对话，以便识别和翻译你说的话。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 将语音识别成文字，以便翻译为对方的语言。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIRequiresFullScreen: YES
  ConversationTranslatorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ConversationTranslator
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ConversationTranslator:
    build:
      targets:
        ConversationTranslator: all
        ConversationTranslatorTests: [test]
    test:
      targets: [ConversationTranslatorTests]
