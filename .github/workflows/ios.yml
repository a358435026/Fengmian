name: iOS checks and unsigned IPA
"on":
  workflow_dispatch:
  push:
    branches: [translator-ios-build]
permissions:
  contents: read
concurrency:
  group: translator-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Test shared recognition, translation and local archive code
        run: swift test 2>&1 | tee test.log
      - name: Install project generator
        run: brew install xcodegen
      - name: Build iOS 15 device IPA
        run: ./scripts/build-ipa.sh
      - name: Verify IPA minimum version and architecture
        run: python3 scripts/verify-ipa.py dist/ConversationTranslator-unsigned.ipa > dist/verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: ConversationTranslator-unsigned
          path: |
            dist/*
            test.log
          if-no-files-found: error
